version: '3.8'

services:
  mcp-salesforce:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Salesforce Authentication - Choose one method:
      
      # Method 1: Username/Password
      - SALESFORCE_CONNECTION_TYPE=User_Password
      - SALESFORCE_USERNAME=${SALESFORCE_USERNAME}
      - SALESFORCE_PASSWORD=${SALESFORCE_PASSWORD}
      - SALESFORCE_TOKEN=${SALESFORCE_TOKEN}
      - SALESFORCE_INSTANCE_URL=${SALESFORCE_INSTANCE_URL:-https://login.salesforce.com}
      
      # Method 2: OAuth Client Credentials (uncomment if using)
      # - SALESFORCE_CONNECTION_TYPE=OAuth_2.0_Client_Credentials
      # - SALESFORCE_CLIENT_ID=${SALESFORCE_CLIENT_ID}
      # - SALESFORCE_CLIENT_SECRET=${SALESFORCE_CLIENT_SECRET}
      # - SALESFORCE_INSTANCE_URL=${SALESFORCE_INSTANCE_URL}
      
      # Security
      - API_KEY=${API_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 256M
    
    # Restart policy
    restart: unless-stopped
    
    # Health check
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Add nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # Add SSL certificates if needed
      # - ./ssl:/etc/ssl/certs:ro
    depends_on:
      - mcp-salesforce
    restart: unless-stopped
    profiles:
      - nginx  # Use: docker-compose --profile nginx up
